<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue.js 3 Fundamentals</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h1>{{ message }}</h1>
        <input v-model="message" />
    </div>
    <script>
        const app = Vue.createApp({
            data() {
                return {
                    message: 'Hello World'
                }
            }
        })
        app.mount('#app')
    </script>
</body>
</html>
